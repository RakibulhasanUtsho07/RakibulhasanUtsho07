    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <g opacity=".28" font-family="monospace" font-size="13" fill="#0e7490">
    <text x="28" y="50">async function createImpact() {</text><text x="48" y="72">build(); learn(); repeat();</text><text x="28" y="94">}</text>
    <text x="650" y="70">type Developer = {</text><text x="670" y="92">curiosity: true;</text><text x="670" y="114">cleanCode: true;</text><text x="650" y="136">};</text>
    <text x="710" y="500">while (alive) improve();</text><text x="740" y="522">git commit -m "keep building"</text>
    <text x="40" y="540">npm run build</text><text x="70" y="562">PASS ✓  |  ship with care</text>
  </g>
