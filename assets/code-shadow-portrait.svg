  <path d="M305 235 C285 200 284 151 306 108 C331 57 382 37 432 44 C486 50 517 91 522 145 C526 181 520 211 504 237 L536 276 L599 318 C630 342 651 379 666 426 L710 600 L125 600 L176 432 C190 383 215 347 250 324 L306 286 Z" fill="none" stroke="url(#cyan)" stroke-width="3" opacity=".9" filter="url(#glow)"/>
  <g font-family="monospace" font-size="16">
    <text x="730" y="205" fill="#67e8f9">const developer = {</text>
    <text x="758" y="236" fill="#fbbf24">name: "Rakibul Hasan Utsho",</text>
    <text x="758" y="267" fill="#67e8f9">role: "Full-Stack Developer",</text>
    <text x="758" y="298" fill="#67e8f9">stack: ["Next.js", "React",</text>
    <text x="806" y="322" fill="#67e8f9">"TypeScript", "Node.js"],</text>
    <text x="758" y="353" fill="#fbbf24">mindset: "always learning"</text>
    <text x="730" y="384" fill="#67e8f9">};</text>
    <text x="730" y="440" fill="#f8fafc" font-size="20">{" "}build(); learn(); ship();</text>
    <text x="730" y="473" fill="#0e7490" font-size="13">// Better code, better tomorrow.</text>
