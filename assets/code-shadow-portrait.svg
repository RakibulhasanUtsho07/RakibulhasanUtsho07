<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Rakibul Hasan Utsho — code-shadow portrait</title>
  <desc id="desc">A stylized developer portrait formed from programming characters on a dark terminal canvas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/><stop offset=".55" stop-color="#061827"/><stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#06b6d4"/><stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="code" width="150" height="32" patternUnits="userSpaceOnUse">
      <text x="0" y="12" fill="#22d3ee" opacity=".70" font-family="monospace" font-size="10">const build = true;</text>
      <text x="12" y="26" fill="#fbbf24" opacity=".52" font-family="monospace" font-size="9">return progress();</text>
    </pattern>
    <pattern id="tinycode" width="20" height="18" patternUnits="userSpaceOnUse">
      <text x="0" y="12" font-family="monospace" font-size="9" fill="#67e8f9">01{};</text>
    </pattern>
    <clipPath id="portrait">
