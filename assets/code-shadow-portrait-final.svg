<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Rakibul Hasan Utsho — code-shadow developer portrait</title>
  <desc id="desc">A dark terminal-style portfolio banner, using the GitHub profile photo as a readable portrait with restrained cyan and amber code characters overlaid as a shadow texture.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".54" stop-color="#071827"/>
      <stop offset="1" stop-color="#02040b"/>
    </linearGradient>
    <linearGradient id="photoShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020617" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#020617" stop-opacity=".16"/>
      <stop offset="1" stop-color="#020617" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="edgeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset=".48" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="rightPanel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#061321" stop-opacity=".35"/>
      <stop offset="1" stop-color="#020617" stop-opacity=".94"/>
    </linearGradient>
    <pattern id="codeRows" width="176" height="38" patternUnits="userSpaceOnUse">
      <text x="0" y="12" font-family="monospace" font-size="10" fill="#67e8f9">const build = true;</text>
      <text x="13" y="26" font-family="monospace" font-size="9" fill="#fbbf24">learn(); improve();</text>
      <text x="5" y="36" font-family="monospace" font-size="8" fill="#38bdf8">return progress;</text>
    </pattern>
    <pattern id="microGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <text x="0" y="12" font-family="monospace" font-size="9" fill="#a5f3fc">01{};</text>
    </pattern>
    <clipPath id="photoClip"><rect x="42" y="34" width="535" height="552" rx="22"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="codeMask">
      <linearGradient id="maskGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="white" stop-opacity=".94"/>
        <stop offset=".72" stop-color="white" stop-opacity=".68"/>
        <stop offset="1" stop-color="white" stop-opacity=".1"/>
      </linearGradient>
      <rect x="42" y="34" width="535" height="552" rx="22" fill="url(#maskGradient)"/>
    </mask>
  </defs>

  <rect width="1200" height="620" fill="url(#background)"/>
  <g opacity=".23" stroke="#155e75" stroke-width="1">
    <path d="M0 108H1200M0 310H1200M0 512H1200"/>
    <path d="M620 0V620M850 0V620M1080 0V620"/>
  </g>
  <g font-family="monospace" font-size="12" fill="#164e63" opacity=".68">
    <text x="28" y="30">01  async function createImpact() {</text>
    <text x="48" y="49">build(); learn(); repeat();</text>
    <text x="28" y="68">}</text>
    <text x="730" y="37">import React from 'react';</text>
    <text x="730" y="56">import Next from 'next';</text>
    <text x="730" y="75">import postgres from 'postgres';</text>
    <text x="28" y="601">npm run build  // PASS ✓</text>
    <text x="858" y="590">git commit -m "keep building"</text>
  </g>

  <g clip-path="url(#photoClip)">
    <rect x="42" y="34" width="535" height="552" fill="#07111f"/>
    <image href="https://avatars.githubusercontent.com/u/251939000?v=4" x="42" y="34" width="535" height="552" preserveAspectRatio="xMidYMid slice"/>
    <rect x="42" y="34" width="535" height="552" fill="url(#photoShade)"/>
    <rect x="42" y="34" width="535" height="552" fill="url(#codeRows)" opacity=".42" mask="url(#codeMask)"/>
    <rect x="42" y="34" width="535" height="552" fill="url(#microGrid)" opacity=".24" mask="url(#codeMask)"/>
    <path d="M42 480 C120 455 162 511 236 488 S376 473 456 490 S535 480 577 455 V586 H42Z" fill="#020617" opacity=".2"/>
  </g>
  <rect x="42" y="34" width="535" height="552" rx="22" fill="none" stroke="url(#edgeGlow)" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M603 54V566" stroke="#155e75" stroke-width="1.5" opacity=".8"/>

  <g font-family="monospace">
    <text x="650" y="142" fill="#67e8f9" font-size="18">const developer = {</text>
    <text x="682" y="178" fill="#fbbf24" font-size="17">name: "Rakibul Hasan Utsho",</text>
    <text x="682" y="211" fill="#67e8f9" font-size="17">role: "Full-Stack Developer",</text>
    <text x="682" y="244" fill="#67e8f9" font-size="17">stack: ["Next.js", "React",</text>
    <text x="735" y="272" fill="#67e8f9" font-size="17">"TypeScript", "PostgreSQL"],</text>
    <text x="682" y="305" fill="#fbbf24" font-size="17">mindset: "always learning"</text>
    <text x="650" y="337" fill="#67e8f9" font-size="18">};</text>
    <text x="650" y="400" fill="#f8fafc" font-size="23">build(); learn(); ship();</text>
    <text x="650" y="433" fill="#38bdf8" font-size="13">// Better code. Better products.</text>
    <text x="650" y="456" fill="#38bdf8" font-size="13">// A better tomorrow.</text>
  </g>

  <g font-family="monospace" font-size="13">
    <text x="650" y="512" fill="#22d3ee">const skills = [</text>
    <text x="674" y="534" fill="#fbbf24">"Docker", "GSAP", "Three.js"</text>
    <text x="650" y="556" fill="#22d3ee">];</text>
    <text x="650" y="584" fill="#64748b" font-size="11">{" "} // focus: craft + curiosity</text>
  </g>

  <g opacity=".8">
    <circle cx="1160" cy="46" r="4" fill="#22d3ee"/>
    <circle cx="1174" cy="46" r="4" fill="#fbbf24"/>
    <circle cx="1188" cy="46" r="4" fill="#10b981"/>
  </g>
  <rect x="1" y="1" width="1198" height="618" fill="none" stroke="#164e63" stroke-opacity=".7"/>
</svg>