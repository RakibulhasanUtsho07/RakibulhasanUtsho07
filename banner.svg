<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Rakibul Hasan Utsho — Full-Stack Developer</title>
  <desc id="d">Profile banner with the developer's name, role and an animated code snippet.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#04202b"/>
      <stop offset="1" stop-color="#0b4f50"/>
    </linearGradient>

    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="670" y2="0">
      <stop offset="0" stop-color="#e2f7ff"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#0f766e" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.45"/>
    </linearGradient>

    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#67e8f9" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>

    <!-- one clip per code line; widths are animated so each line is "typed" in -->
    <clipPath id="c1"><rect x="740" y="94"  width="400" height="26"><animate attributeName="width" values="0;0;400;400" keyTimes="0;0.043;0.121;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="740" y="120" width="400" height="26"><animate attributeName="width" values="0;0;400;400" keyTimes="0;0.136;0.214;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="740" y="146" width="400" height="26"><animate attributeName="width" values="0;0;400;400" keyTimes="0;0.229;0.307;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="740" y="172" width="400" height="26"><animate attributeName="width" values="0;0;400;400" keyTimes="0;0.321;0.400;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c5"><rect x="740" y="198" width="400" height="26"><animate attributeName="width" values="0;0;400;400" keyTimes="0;0.414;0.493;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c6"><rect x="740" y="224" width="400" height="26"><animate attributeName="width" values="0;0;400;400" keyTimes="0;0.507;0.557;1" dur="14s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <!-- background -->
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <circle cx="960" cy="70" r="230" fill="url(#glowCyan)">
      <animate attributeName="r" values="215;245;215" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="330" r="240" fill="url(#glowTeal)">
      <animate attributeName="r" values="230;260;230" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- drifting waves along the bottom -->
    <path fill="#22d3ee" fill-opacity="0.10"
          d="M0 312 Q150 290 300 312 T600 312 T900 312 T1200 312 T1500 312 T1800 312 T2100 312 T2400 312 V340 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path fill="#0f766e" fill-opacity="0.35"
          d="M0 322 Q150 342 300 322 T600 322 T900 322 T1200 322 T1500 322 T1800 322 T2100 322 T2400 322 V340 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="16s" repeatCount="indefinite"/>
    </path>

    <!-- left: name, role, one-line intro -->
    <rect x="60" y="64" width="56" height="4" rx="2" fill="#fbbf24"/>

    <text x="60" y="130" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="58" font-weight="800" fill="url(#name)"
          textLength="610" lengthAdjust="spacingAndGlyphs">Rakibul Hasan Utsho</text>

    <text x="60" y="184" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif"
          font-size="28" font-weight="600" fill="#5eead4">Full-Stack Developer</text>

    <text font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9fb4c7">
      <tspan x="60" y="226">I turn ideas into reliable, well-crafted web products</tspan>
      <tspan x="60" y="251">with React, Next.js, TypeScript and Node.js.</tspan>
    </text>

    <!-- right: code window -->
    <rect x="730" y="44" width="410" height="224" rx="14" fill="#020617" fill-opacity="0.78" stroke="#22d3ee" stroke-opacity="0.35"/>
    <line x1="731" y1="82" x2="1139" y2="82" stroke="#22d3ee" stroke-opacity="0.15"/>
    <circle cx="753" cy="63" r="5" fill="#fb7185" fill-opacity="0.8"/>
    <circle cx="771" cy="63" r="5" fill="#fbbf24" fill-opacity="0.8"/>
    <circle cx="789" cy="63" r="5" fill="#34d399" fill-opacity="0.8"/>
    <text x="935" y="68" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="13" fill="#64748b">developer.ts</text>

    <g font-family="'Fira Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="15">
      <text x="752" y="112" clip-path="url(#c1)"><tspan fill="#c4b5fd">const</tspan> <tspan fill="#67e8f9">developer</tspan> <tspan fill="#94a3b8">= {</tspan></text>
      <text x="776" y="138" clip-path="url(#c2)"><tspan fill="#e2f7ff">name</tspan><tspan fill="#94a3b8">:</tspan> <tspan fill="#fcd34d">"Rakibul Hasan Utsho"</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text x="776" y="164" clip-path="url(#c3)"><tspan fill="#e2f7ff">stack</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#fcd34d">"Next.js"</tspan><tspan fill="#94a3b8">,</tspan> <tspan fill="#fcd34d">"TypeScript"</tspan><tspan fill="#94a3b8">],</tspan></text>
      <text x="776" y="190" clip-path="url(#c4)"><tspan fill="#e2f7ff">focus</tspan><tspan fill="#94a3b8">:</tspan> <tspan fill="#fcd34d">"APIs, UI, Auth"</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text x="776" y="216" clip-path="url(#c5)"><tspan fill="#e2f7ff">motto</tspan><tspan fill="#94a3b8">:</tspan> <tspan fill="#fcd34d">"Learn. Build. Ship."</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text x="752" y="242" clip-path="url(#c6)" fill="#94a3b8">};</text>
    </g>
    <rect x="776" y="229" width="9" height="16" rx="1" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
